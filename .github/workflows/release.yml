name: Release

on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci
      - run: npm run build
      - run: npm prune --production

      # The tag must match manifest.json and package.json: a registry entry
      # pairs a version with the SHA256 of this exact tarball (spec 089).
      - name: Tag matches manifest and package versions
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          M=$(node -p "require('./manifest.json').version")
          P=$(node -p "require('./package.json').version")
          if [ "$M" != "$VERSION" ] || [ "$P" != "$VERSION" ]; then
            echo "Tag v$VERSION but manifest.json=$M, package.json=$P" >&2
            exit 1
          fi

      - name: Package pre-built tarball
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          PLUGIN_ID=$(node -p "require('./manifest.json').id")
          tar czf sowel-plugin-${PLUGIN_ID}-${VERSION}.tar.gz manifest.json package.json dist/ node_modules/

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          PLUGIN_ID=$(node -p "require('./manifest.json').id")
          gh release create ${{ github.ref_name }} \
            sowel-plugin-${PLUGIN_ID}-${VERSION}.tar.gz \
            --title "${{ github.ref_name }}" \
            --generate-notes
